<mat-card appearance="outlined" class="product-card">
  <div class="product-image">
    <!-- NgOptimizedImage obsługuje ngSrc. Wymiary określają proporcje, CSS układ obrazu. -->
    <!-- priority przyspiesza pobranie głównej ilustracji widocznej od razu na stronie. -->
    <img
      [ngSrc]="item().imageUrl"
      width="480"
      height="360"
      [alt]="'Ilustracja produktu: ' + item().name"
      priority
    />
  </div>
  <div class="product-information">
    <mat-card-header>
      <mat-card-subtitle>Produkt #{{ item().id }}</mat-card-subtitle>
      <mat-card-title
        ><h2>{{ item().name }}</h2></mat-card-title
      >
    </mat-card-header>
    <mat-card-content>
      <p class="price-label">Cena jednostkowa</p>
      <p class="price">
        {{ item().price | currency: "PLN" : "symbol" : "1.2-2" : "pl" }}
      </p>
      <dl class="product-facts">
        <div>
          <dt>Dostępność</dt>
          <dd>{{ item().quantity | stockLabel }}</dd>
        </div>
        <div>
          <dt>Stan magazynowy</dt>
          <dd>{{ item().quantity }} szt.</dd>
        </div>
      </dl>
    </mat-card-content>
    <mat-card-actions>
      <a mat-flat-button [routerLink]="['/items', item().id, 'edit']"
        >Edytuj produkt</a
      >
    </mat-card-actions>
  </div>
</mat-card>
